name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository foundation
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -d docs/architecture

      - name: Detect Node project
        id: node-project
        run: |
          if [ -f package.json ] && [ -f package-lock.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.node-project.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.node-project.outputs.available == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.node-project.outputs.available == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.node-project.outputs.available == 'true'
        run: npm test -- --run
