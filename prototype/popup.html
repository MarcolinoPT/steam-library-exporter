<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Steam Library Comparator</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Steam Library Comparator</h1>
      <p class="notice">
        Temporary diagnostic. Only aggregate counts are displayed.
        Raw library entries are kept in memory for comparison and discarded.
      </p>
      <button id="compare-button" type="button">Compare my Steam sources</button>
      <p id="status" role="status" aria-live="polite">Ready.</p>
      <section id="results" hidden aria-label="Comparison results">
        <h2>AppID comparison</h2>
        <div id="metrics"></div>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
      <p class="footnote">
        This experiment does not establish that either source is complete.
      </p>
    </main>
  </body>
</html>
